name: Release binaries

# Build the standalone binaries for every platform and attach them to the
# GitHub Release when one is published. Bun cross-compiles all targets from a
# single runner (see build.ts), so no build matrix is needed.
on:
  release:
    types: [published]
  # Allow a manual run to verify the build without publishing assets.
  workflow_dispatch:

permissions:
  contents: write # required to upload release assets

jobs:
  build:
    name: Build & attach binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (typecheck + cross-compile all targets)
        run: bun run build

      - name: Generate checksums
        run: |
          cd binaries
          # Combined manifest first (only the binaries exist yet), then per-file
          # checksums. Verify with: sha256sum -c SHA256SUMS.txt
          sha256sum agenthub-* > SHA256SUMS.txt
          for f in agenthub-*; do sha256sum "$f" > "$f.sha256"; done
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt
          ls -lh

      - name: Upload binaries + checksums to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            binaries/agenthub-*
            binaries/SHA256SUMS.txt

      - name: Upload binaries as workflow artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: agenthub-binaries
          path: binaries/*
